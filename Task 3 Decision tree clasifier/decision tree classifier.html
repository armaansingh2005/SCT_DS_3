<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Decision Tree Customer Predictor</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    135deg,
    #667eea,
    #764ba2
    );

}



.container{

    width:430px;

    background:white;

    padding:30px;

    border-radius:25px;

    box-shadow:
    0 20px 50px
    rgba(0,0,0,.4);

    animation:show .7s ease;

}



@keyframes show{

from{

opacity:0;
transform:translateY(-50px);

}

to{

opacity:1;
transform:translateY(0);

}

}



h1{

text-align:center;

color:#333;

margin-bottom:20px;

}



label{

font-weight:bold;

}



input,select{

width:100%;

padding:12px;

margin:10px 0;

border-radius:10px;

border:1px solid #aaa;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:20px;

background:#667eea;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}



button:hover{

background:#764ba2;

transform:scale(1.05);

}



.result{

margin-top:20px;

padding:20px;

border-radius:15px;

background:#eee;

text-align:center;

font-size:18px;

animation:fade .5s ease;

}



@keyframes fade{

from{

opacity:0;

}

to{

opacity:1;

}

}



.success{

color:green;

font-weight:bold;

}


.fail{

color:red;

font-weight:bold;

}



</style>


</head>



<body>


<div class="container">


<h1>🌳 Decision Tree Predictor</h1>



<label>Age</label>

<input 
type="number"
id="age"
placeholder="Enter Age">



<label>Job Type</label>

<select id="job">

<option value="student">
Student
</option>

<option value="employee">
Employee
</option>

<option value="business">
Business
</option>

</select>




<label>Account Balance ($)</label>

<input 
type="number"
id="balance"
placeholder="Enter Balance">




<label>Previous Campaign Response</label>

<select id="response">

<option value="yes">
Positive
</option>


<option value="no">
Negative
</option>

</select>




<button onclick="predict()">

Predict Purchase

</button>



<div id="output"></div>


</div>








<script>


// Decision Tree Model Logic
// Inspired from Bank Marketing Dataset


function predict(){


let age =
Number(
document.getElementById("age").value
);



let job =
document.getElementById("job").value;



let balance =
Number(
document.getElementById("balance").value
);



let response =
document.getElementById("response").value;




let prediction;

let probability;

let reason;





// Decision Tree Rules


if(response==="yes"){


prediction="YES";

probability=90;


reason=
"Customer responded positively earlier";


}



else if(balance>5000){



prediction="YES";

probability=80;


reason=
"High account balance indicates buying ability";


}





else if(
age>=25 &&
age<=45 &&
job!="student"
){



prediction="YES";

probability=70;


reason=
"Working age customer with stable profile";


}





else{



prediction="NO";


probability=30;


reason=
"Low purchasing probability based on features";



}






showResult(

prediction,

probability,

reason

);



}








function showResult(
prediction,
probability,
reason
){



let output =
document.getElementById("output");



let color =
prediction==="YES"
?
"success"
:
"fail";





output.innerHTML =

`

<div class="result">


<h2 class="${color}">

Prediction : ${prediction}

</h2>



<p>

Purchase Probability:

${probability}%

</p>



<p>

Decision Path:

${reason}

</p>


</div>


`;



}





</script>


</body>

</html>
